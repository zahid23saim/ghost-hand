name = "ghost-hand"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Anonymous counters: one DailyStats per UTC date, one global Stats.
[[durable_objects.bindings]]
name = "DAILY"
class_name = "DailyStats"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DailyStats", "Stats"]
