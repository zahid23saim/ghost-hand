<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost Hand - feel lab</title>
<style>
  :root { --bg:#16121f; --ink:#f3ecdf; --dim:#a79fb6; --gold:#f2c46d; --mint:#7fe0c3; --rose:#ff8fa3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 12px; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  header b { color: var(--ink); letter-spacing: .12em; }
  header button, .panel button { background: #2a2338; color: var(--ink); border: 1px solid #3d3450; border-radius: 8px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #pad { flex: 0 0 auto; height: 26dvh; margin: 0 12px 10px; border-radius: 18px; background: radial-gradient(circle at 50% 50%, #2a2338, #1c1726); border: 1px dashed #4a3f60; display: none; align-items: center; justify-content: center; color: var(--dim); font-size: 14px; position: relative; }
  #whisper { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(242,196,109,.12); border: 1px solid rgba(242,196,109,.4); color: var(--gold); font-weight: 600; pointer-events: none; }
  #toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); color: var(--mint); font-weight: 600; pointer-events: none; transition: opacity .4s; }
  .panel { position: fixed; right: 10px; top: 46px; width: 300px; max-height: calc(100dvh - 60px); overflow: auto; background: rgba(22,18,31,.96); border: 1px solid #3d3450; border-radius: 12px; padding: 10px 12px; font-size: 12px; display: none; touch-action: pan-y; z-index: 5; }
  .panel.open { display: block; }
  .row { display: grid; grid-template-columns: 96px 1fr 46px; gap: 6px; align-items: center; margin: 4px 0; }
  .row input { width: 100%; }
  .row span:last-child { text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
  @media (orientation: portrait) and (max-width: 820px) { #pad { display: flex; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <b>GHOST HAND</b><span>feel lab</span>
    <span id="room"></span>
    <button id="copy">Copy invite link</button>
    <button id="toggle">Sliders</button>
    <span id="stats"></span>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="whisper">Connecting...</div>
    <div id="toast"></div>
  </div>
  <div id="pad">Drag here to push</div>
</div>
<div class="panel" id="panel">
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
    <button id="reset">Reset all</button>
    <button id="skip">Next phrase</button>
  </div>
  <div class="row"><span>Bots</span><input id="bots" type="range" min="0" max="7" step="1" value="2"><span id="botsV">2</span></div>
  <div class="row"><span>Bot skill</span><input id="skill" type="range" min="0" max="1" step="0.05" value="0.6"><span id="skillV">0.6</span></div>
  <hr style="border-color:#3d3450">
  <div id="sliders"></div>
</div>
<script type="module" src="/js/lab.js"></script>
</body>
</html>
